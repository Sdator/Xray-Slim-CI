name: Xray Docker Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 准备测试配置文件 (这里写一个最简单的 Socks5 代理配置)
      - name: Prepare Xray Config
        run: |
          mkdir -p ./etc
          echo '{
            "inbounds": [{"port": 1080, "protocol": "socks", "settings": {"auth": "noauth"}}],
            "outbounds": [{"protocol": "freedom"}]
          }' > ./etc/config.json

      # 2. 构建精简镜像 (基于我们之前讨论的 Distroless 或 Alpine)
      - name: Build Xray Image
        run: |
          docker build -t xray-test:local .

      # 3. 运行容器
      - name: Run Xray Container
        run: |
          docker run -d --name xray-server \
            -v $(pwd)/etc:/etc/xray \
            -p 1080:1080 \
            xray-test:local

      # 4. 等待容器启动并进行健康检查
      - name: Health Check & Test
        run: |
          # 等待 2 秒确保服务启动
          sleep 2

          # 检查容器日志是否有错误
          docker logs xray-server

          # 使用 curl 通过 Xray 提供的 Socks5 代理访问 google (验证代理是否生效)
          # -x 指定代理地址
          curl -v -x socks5h://127.0.0.1:1080 https://www.google.com --connect-timeout 5

      - name: Cleanup
        if: always()
        run: docker rm -f xray-server